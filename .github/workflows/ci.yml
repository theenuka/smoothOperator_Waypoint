# Runs on every pull request: install, test the backend, build the web app.
# A red X means something is broken. The Lead does not merge red PRs.
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: No AI co-author or attribution lines (commits are made by team members only)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: |
          PATTERN='co-authored-by:.*(claude|anthropic|gemini|copilot|openai|chatgpt)|noreply@anthropic\.com|generated with \[?claude|claude-session:|claude\.ai/code'
          if git log --format=%B "origin/$BASE..HEAD" | grep -iE "$PATTERN"; then
            echo "::error::A commit message has an AI co-author/attribution line. Fix: see CONTRIBUTING.md (Remove AI attribution)."
            exit 1
          fi
          if printf '%s' "$PR_BODY" | grep -iE "$PATTERN"; then
            echo "::error::The PR description has an AI attribution line. Edit the PR description and delete it, then re-run the checks."
            exit 1
          fi
      - run: npm ci
      - name: Formatting (run `npm run format` locally if this fails)
        run: npm run format:check
      - run: npm test
      - run: npm run build
