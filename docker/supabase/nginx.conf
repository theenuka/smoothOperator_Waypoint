# Local Supabase gateway: the same /auth/v1 and /rest/v1 paths as a hosted project.
# The web app (localhost:8080) calls it from the browser, so it answers CORS here.
server {
  listen 8000;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Credentials;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;
  add_header Access-Control-Allow-Origin * always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
  if ($request_method = OPTIONS) { return 204; }

  location /auth/v1/ { proxy_pass http://auth:9999/; }
  location /rest/v1/ { proxy_pass http://rest:3000/; }
}
